spring.application.name=bookreview

spring.datasource.url=jdbc:h2:mem:book
# For file-based persistence: spring.datasource.url=jdbc:h2:file:/data/demo
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=h2
spring.datasource.password=h2@1234

# H2 Console Configuration (optional, for accessing the web console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console